[package]
name = "artifact_query"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Identify forensic artifact types from their first bytes (magic.json)."
license = "GPL-3.0"

[features]
default = ["cli"]
# Command line tool. Libraries can use `default-features = false` to avoid clap.
cli = ["dep:clap", "dep:anyhow"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2"
anyhow = { version = "1.0.98", optional = true }
clap = { version = "4.5.40", features = ["derive"], optional = true }

[[bin]]
name = "main"
path = "src/bin/main.rs"
required-features = ["cli"]
